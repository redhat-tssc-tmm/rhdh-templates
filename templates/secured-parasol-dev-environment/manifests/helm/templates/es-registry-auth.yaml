apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: registry-auth
  namespace: ${{ values.namespace }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: registry-auth
    creationPolicy: Owner
  data:
    - secretKey: auth.json
      remoteRef:
        key: secrets/common/registry-auth
        property: value
