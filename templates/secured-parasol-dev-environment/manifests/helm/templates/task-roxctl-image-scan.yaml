apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: roxctl-image-scan
  namespace: ${{ values.namespace }}
spec:
  params:
    - name: image
      type: string
    - name: rox_central_endpoint
      type: string
      default: "central.rhacs.svc:443"
    - name: insecure-skip-tls-verify
      type: string
      default: "true"
  results:
    - name: SCAN_RESULTS
      description: Summary of scan results
    - name: CRITICAL_COUNT
      description: Number of critical vulnerabilities
    - name: HIGH_COUNT
      description: Number of high vulnerabilities
    - name: MEDIUM_COUNT
      description: Number of medium vulnerabilities
  steps:
    - name: scan
      image: registry.redhat.io/openshift4/ose-cli-rhel9:latest
      env:
        - name: ROX_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: rhacs-api-token
              key: token
        - name: ROX_CENTRAL_ENDPOINT
          value: $(params.rox_central_endpoint)
        - name: ROX_ENDPOINT
          value: $(params.rox_central_endpoint)
        - name: ROX_INSECURE_CLIENT_SKIP_TLS_VERIFY
          value: $(params.insecure-skip-tls-verify)
      script: |
        #!/usr/bin/env bash
        set -uo pipefail

        echo "Downloading roxctl from RHACS Central..."
        curl -sk "https://${ROX_CENTRAL_ENDPOINT}/api/cli/download/roxctl-linux-amd64" \
          -H "Authorization: Bearer ${ROX_API_TOKEN}" \
          -o /usr/local/bin/roxctl
        chmod +x /usr/local/bin/roxctl

        echo "Scanning image: $(params.image)"

        roxctl image scan \
          --image="$(params.image)" \
          --output=json > /tmp/scan-results.json 2>/tmp/scan-stderr.txt || true

        if [ ! -s /tmp/scan-results.json ]; then
          echo "Scan produced no results"
          echo -n "0" > $(results.CRITICAL_COUNT.path)
          echo -n "0" > $(results.HIGH_COUNT.path)
          echo -n "0" > $(results.MEDIUM_COUNT.path)
          echo -n "Scan failed — see logs" > $(results.SCAN_RESULTS.path)
          cat /tmp/scan-stderr.txt
          exit 1
        fi

        python3 << 'PYEOF'
        import json, sys
        try:
            with open("/tmp/scan-results.json") as f:
                data = json.load(f)
            summary = data.get("result", {}).get("summary", {})
            critical = summary.get("CRITICAL", 0)
            high = summary.get("IMPORTANT", 0)
            medium = summary.get("MODERATE", 0)
            with open("/tmp/critical", "w") as f: f.write(str(critical))
            with open("/tmp/high", "w") as f: f.write(str(high))
            with open("/tmp/medium", "w") as f: f.write(str(medium))
            with open("/tmp/scan_summary", "w") as f: f.write(f"Critical: {critical}, High: {high}, Medium: {medium}")
        except Exception as e:
            for name in ["critical", "high", "medium"]:
                with open(f"/tmp/{name}", "w") as f: f.write("0")
            with open("/tmp/scan_summary", "w") as f: f.write(f"Parse error: {e}")
        PYEOF

        cat /tmp/critical > $(results.CRITICAL_COUNT.path)
        cat /tmp/high > $(results.HIGH_COUNT.path)
        cat /tmp/medium > $(results.MEDIUM_COUNT.path)
        cat /tmp/scan_summary > $(results.SCAN_RESULTS.path)

        echo "Scan complete — $(cat /tmp/scan_summary)"
