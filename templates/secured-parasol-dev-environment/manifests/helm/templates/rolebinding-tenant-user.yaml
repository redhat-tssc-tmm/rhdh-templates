apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-user-${{ values.owner }}
  namespace: ${{ values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tenant-user
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: ${{ values.owner }}
