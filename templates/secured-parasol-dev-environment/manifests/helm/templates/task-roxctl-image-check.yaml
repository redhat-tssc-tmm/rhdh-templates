apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: roxctl-image-check
  namespace: ${{ values.namespace }}
spec:
  params:
    - name: image
      type: string
    - name: rox_central_endpoint
      type: string
      default: "central.rhacs.svc:443"
    - name: insecure-skip-tls-verify
      type: string
      default: "true"
  results:
    - name: CHECK_RESULT
      description: Policy check result (PASS or FAIL)
    - name: VIOLATIONS_SUMMARY
      description: Summary of policy violations
  steps:
    - name: check
      image: registry.redhat.io/openshift4/ose-cli-rhel9:latest
      env:
        - name: ROX_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: rhacs-api-token
              key: token
        - name: ROX_CENTRAL_ENDPOINT
          value: $(params.rox_central_endpoint)
        - name: ROX_ENDPOINT
          value: $(params.rox_central_endpoint)
        - name: ROX_INSECURE_CLIENT_SKIP_TLS_VERIFY
          value: $(params.insecure-skip-tls-verify)
      script: |
        #!/usr/bin/env bash
        set -uo pipefail

        echo "Downloading roxctl from RHACS Central..."
        curl -sk "https://${ROX_CENTRAL_ENDPOINT}/api/cli/download/roxctl-linux-amd64" \
          -H "Authorization: Bearer ${ROX_API_TOKEN}" \
          -o /usr/local/bin/roxctl
        chmod +x /usr/local/bin/roxctl

        echo "Checking image: $(params.image)"

        roxctl image check \
          --image="$(params.image)" \
          --output=json > /tmp/check-results.json 2>/tmp/check-stderr.txt
        CHECK_EXIT=$?

        python3 << 'PYEOF'
        import json
        try:
            with open("/tmp/check-results.json") as f:
                data = json.load(f)
            results = data.get("results", [])
            if results:
                r = results[0]
                policies = r.get("violatedPolicies", [])
                breaking = [p["name"] for p in policies if p.get("failingCheck", False)]
                total = len(policies)
                breaking_names = "; ".join(breaking) if breaking else "none"
                summary = f"{total} policy violations, {len(breaking)} breaking: {breaking_names}"
                check_result = "FAIL" if breaking else "PASS"
            else:
                summary = "No policy violations"
                check_result = "PASS"
            with open("/tmp/check_result", "w") as f: f.write(check_result)
            with open("/tmp/violations_summary", "w") as f: f.write(summary[:4096])
        except Exception as e:
            with open("/tmp/check_result", "w") as f: f.write("UNKNOWN")
            with open("/tmp/violations_summary", "w") as f: f.write(f"Parse error: {e}")
        PYEOF

        cat /tmp/check_result > $(results.CHECK_RESULT.path)
        cat /tmp/violations_summary > $(results.VIOLATIONS_SUMMARY.path)

        CHECK_RESULT=$(cat /tmp/check_result)
        VIOLATIONS_SUMMARY=$(cat /tmp/violations_summary)
        if [ "${CHECK_RESULT}" = "FAIL" ]; then
          echo "Policy check FAILED: ${VIOLATIONS_SUMMARY}"
          exit 1
        else
          echo "Policy check PASSED: ${VIOLATIONS_SUMMARY}"
        fi
