apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: acs-image-check
  namespace: ${{ values.namespace }}
  annotations:
    task.results.format: application/json
    task.results.type: roxctl-image-check
    task.results.key: SCAN_OUTPUT
    task.output.location: logs
    task.results.container: step-report
spec:
  params:
    - name: IMAGE
      type: string
    - name: ROX_CENTRAL_ENDPOINT
      type: string
      default: "central.rhacs.svc:443"
    - name: INSECURE_SKIP_TLS_VERIFY
      type: string
      default: "true"
  results:
    - name: ACS_IMAGE_CHECK_OUTPUT
      description: ACS policy check status for RHDH task status column
  workspaces:
    - name: source
      optional: true
  volumes:
    - name: check-output
      emptyDir: {}
  steps:
    - name: check
      image: registry.access.redhat.com/ubi9-minimal:latest
      env:
        - name: ROX_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: rhacs-api-token
              key: token
        - name: ROX_CENTRAL_ENDPOINT
          value: $(params.ROX_CENTRAL_ENDPOINT)
      volumeMounts:
        - name: check-output
          mountPath: /tmp/check-output
      script: |
        #!/usr/bin/env bash
        set -uo pipefail

        curl -sk -L -H "Authorization: Bearer ${ROX_API_TOKEN}" \
          "https://${ROX_CENTRAL_ENDPOINT}/api/cli/download/roxctl-linux" \
          --output /tmp/roxctl
        chmod +x /tmp/roxctl

        /tmp/roxctl image check --force \
          --insecure-skip-tls-verify=$(params.INSECURE_SKIP_TLS_VERIFY) \
          -e "${ROX_CENTRAL_ENDPOINT}" \
          --categories="Parasol Secured Build Gate" \
          --output json \
          --image "$(params.IMAGE)" \
          > /tmp/check-output/image-check.json
        CHECK_EXIT=$?

        echo "ACS image check completed for $(params.IMAGE)" >&2
        echo -n "${CHECK_EXIT}" > /tmp/check-output/exit-code

        if [ -d "$(workspaces.source.path)" ]; then
          mkdir -p "$(workspaces.source.path)/acs-results"
          cp /tmp/check-output/image-check.json "$(workspaces.source.path)/acs-results/image-check.json"
        fi

        exit 0
    - name: report
      image: registry.access.redhat.com/ubi9-minimal:latest
      computeResources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      volumeMounts:
        - name: check-output
          mountPath: /tmp/check-output
      script: |
        #!/usr/bin/env bash
        cat /tmp/check-output/image-check.json
    - name: status
      image: registry.access.redhat.com/ubi9:latest
      computeResources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      volumeMounts:
        - name: check-output
          mountPath: /tmp/check-output
      script: |
        #!/usr/bin/env bash
        CHECK_EXIT=$(cat /tmp/check-output/exit-code)
        if [ "${CHECK_EXIT}" = "0" ]; then
          echo -n '{"result":"SUCCESS","note":"✅ Policy Check Passed"}' > $(results.ACS_IMAGE_CHECK_OUTPUT.path)
        else
          COUNT=$(python3 -c "
        import json
        try:
            data = json.load(open('/tmp/check-output/image-check.json'))
            results = data.get('results', [])
            if results:
                policies = results[0].get('violatedPolicies', [])
                breaking = [p for p in policies if p.get('failingCheck', False)]
                print(len(breaking))
            else:
                print(1)
        except:
            print(1)
        " 2>/dev/null)
          if [ "${COUNT}" = "1" ]; then
            echo -n '{"result":"WARNING","note":"⚠️ Policy Violation"}' > $(results.ACS_IMAGE_CHECK_OUTPUT.path)
          else
            echo -n "{\"result\":\"WARNING\",\"note\":\"⚠️ ${COUNT} Policy Violations\"}" > $(results.ACS_IMAGE_CHECK_OUTPUT.path)
          fi
        fi
    - name: enforce
      image: registry.access.redhat.com/ubi9-minimal:latest
      computeResources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      volumeMounts:
        - name: check-output
          mountPath: /tmp/check-output
      script: |
        #!/usr/bin/env bash
        # Sandbox mode: report violations but never fail the build.
        # Enforcement happens only in the secured-build pipeline.
        CHECK_EXIT=$(cat /tmp/check-output/exit-code)
        if [ "${CHECK_EXIT}" != "0" ]; then
          echo "ACS image check found policy violations (exit code ${CHECK_EXIT}) — informational only in sandbox mode" >&2
        fi
        exit 0
