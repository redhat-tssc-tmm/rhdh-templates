apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: maven-build
  namespace: ${{ values.namespace }}
spec:
  results:
    - name: MAVEN_BUILD_OUTPUT
      description: Maven build status for RHDH task status column
  workspaces:
    - name: source
    - name: maven-cache
      optional: true
  steps:
    - name: maven-build
      image: registry.access.redhat.com/ubi9/openjdk-21:1.20
      workingDir: $(workspaces.source.path)
      env:
        - name: MAVEN_OPTS
          value: "-Dmaven.repo.local=$(workspaces.maven-cache.path)/.m2/repository"
      script: |
        #!/usr/bin/env bash
        set -ex
        mvn package
        echo -n '{"result":"SUCCESS","note":"✅ Maven: BUILD SUCCESS"}' > $(results.MAVEN_BUILD_OUTPUT.path)
